version: 2
updates:
  - package-ecosystem: "pub"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: weekly
    # Flutter's flutter_test pins stack_trace/meta exactly, so raising our floors breaks consumers on older Flutter
    versioning-strategy: increase-if-necessary
    groups:
      pub-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: weekly
    groups:
      release-tooling:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: weekly
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
